[project]
name = "ctb"
version = "0.1.0"
description = "Does a shared sequence bottleneck limit cell-type-specific variant effects in single-cell accessibility models?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "fsspec>=2024.6",
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "requests>=2.32",
    "tqdm>=4.66",
    "h5py>=3.11",
    "anndata>=0.10",
    "scanpy[scrublet]>=1.10",
    "leidenalg>=0.10",
    "igraph>=0.11",
    "pyfaidx>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]
# scvi-tools is only the G0 reference implementation, never imported by the package itself.
ref = ["scvi-tools>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
